}
* { box-sizing: border-box; margin: 0; padding: 0; }

.bar { position: fixed; top: 0; left: 0; right: 0; z-index: 20; height: calc(var(--bar-h) + env(safe-area-inset-top)); padding: env(safe-area-inset-top) 12px 0 16px; display: flex; align-items: center; gap: 12px; border-width: 0 0 1px; }

.btn { appearance: none; border: 1px solid var(--border); background: var(--surface-2); color: var(--text); border-radius: 8px; min-height: 36px; min-width: 36px; padding: 0 10px; font: inherit; font-size: 12px; font-weight: 600; cursor: pointer; display: inline-flex; align-items: center; justify-content: center; gap: 6px; touch-action: manipulation; }
.btn:hover { border-color: var(--accent); }

.ficha dt { color: var(--muted); }
.ficha .cerrar { position: absolute; top: 8px; right: 8px; }
.ficha .enfocar { margin-top: 10px; }
.gizmo { position: fixed; z-index: 12; top: calc(var(--bar-h) + env(safe-area-inset-top) + 12px); right: 12px; width: 96px; height: 96px; border-radius: 50%; cursor: pointer; border: 1px solid var(--border); }
.cota-lbl, .tag-lbl { font-size: 11px; font-weight: 700; line-height: 1; white-space: nowrap; padding: 3px 6px; border-radius: 5px; font-variant-numeric: tabular-nums; }

.tag-lbl { color: var(--tag); background: var(--cota-bg); border: 1px solid var(--border); font-weight: 600; }

@media (max-width: 720px) {

}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
@media print {

<script>

  setTimeout(function () {
    var v = window.__viewer;
    if (v && (v.ready || v.fallo)) return;
    var el = document.getElementById('fallo');
    el.dataset.tipo = 'carga'; el.hidden = false;
    el.querySelector('.msg').innerHTML = '<h2>No se pudo cargar el motor 3D</h2><p>El visor descarga Three.js desde cdn.jsdelivr.net. Revisa la conexión a internet o un bloqueador de contenido y recarga la página.</p>';

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { CSS2DRenderer, CSS2DObject } from 'three/addons/renderers/CSS2DRenderer.js';

/* ============================== SPEC:INICIO ==============================
   Datos del objeto. Unidades: mm. Esquema completo en SPEC.md de la skill.
   Este SPEC de ejemplo se reemplaza entero.                                  */

const MESA = { ancho: 1200, fondo: 600, alto: 750, tapa: 18 };
const PINO = [45, 70];                                  // sección cepillada 2×3"
const PATA = { x: MESA.ancho / 2 - 40, z: MESA.fondo / 2 - 40 };
const EST = { x: -250, diam: 300, alto: 400, agua: 300 };
const MACETAS = [[-150, -60], [150, -60]];              // [x, z] sobre la tapa
const GAB = { x: 450, z: 180, dims: [160, 70, 120], pared: 3 };

const SPEC = {
  titulo: 'Ejemplo — Mesa de cultivo',
  subtitulo: 'SPEC de muestra de la plantilla · reemplazar completo',
  orientacion: { modo: 'cardinal', frente: 'N' },
  escala: 'auto',
  vistaInicial: 'iso',
  capas: [
    { id: 'estructura', nombre: 'Estructura de madera' },
    { id: 'hidraulica', nombre: 'Estanque y riego' },
    { id: 'cultivo', nombre: 'Macetas y plantas' },
    { id: 'control', nombre: 'Gabinete de control' },
  ],
  piezas: [
    { tipo: 'viga', nombre: 'Pata', capa: 'estructura', material: 'madera', seccion: PINO,
      desde: [0, 0, 0], hasta: [0, MESA.alto - MESA.tapa, 0],
      en: [[-PATA.x, 0, -PATA.z], [PATA.x, 0, -PATA.z], [-PATA.x, 0, PATA.z], [PATA.x, 0, PATA.z]] },
    { tipo: 'viga', nombre: 'Travesaño', capa: 'estructura', material: 'madera', seccion: PINO,
      desde: [-PATA.x, 150, 0], hasta: [PATA.x, 150, 0], en: [[0, 0, -PATA.z], [0, 0, PATA.z]] },
    { tipo: 'caja', nombre: 'Tapa', capa: 'estructura', material: 'madera', nota: 'Terciado 18 mm',
      dims: [MESA.ancho, MESA.tapa, MESA.fondo], pos: [0, MESA.alto - MESA.tapa, 0] },
    { tipo: 'extrusion', nombre: 'Escuadra L', capa: 'estructura', material: 'metal', profundidad: 40,
      contorno: [[0, 0], [60, 0], [60, 4], [4, 4], [4, 60], [0, 60]],
      pos: [-PATA.x + PINO[0] / 2, MESA.alto - MESA.tapa - 60, -PATA.z - 20] },

    { tipo: 'cilindro', id: 'estanque', nombre: 'Estanque', capa: 'hidraulica', material: 'hdpe-translucido',
      diam: EST.diam, alto: EST.alto, pos: [EST.x, 0, 0], orden: 2 },
    { tipo: 'cilindro', nombre: 'Agua', capa: 'hidraulica', material: 'agua', orden: 1,
      diam: EST.diam - 10, alto: EST.agua, pos: [EST.x, 5, 0],
      nota: `Nivel ${fmtLen(EST.agua)} ≈ ${fmtNum(litros(EST.diam - 10, EST.agua))} L` },
    { tipo: 'caja', nombre: 'Bomba', capa: 'hidraulica', material: 'plastico-negro',
      dims: [40, 45, 40], pos: [EST.x, 5, 0], dentroDe: 'estanque' },
    { tipo: 'manguera', nombre: 'Manguera', capa: 'hidraulica', material: 'manguera', diam: 8,
      repetir: { n: MACETAS.length },
      puntos: (i) => [[EST.x, 50, 0], [EST.x, EST.alto + 60, 0],
        [(EST.x + MACETAS[i][0]) / 2, MESA.alto + 300, MACETAS[i][1] / 2],
        [MACETAS[i][0] + 60, MESA.alto + 240, MACETAS[i][1]]] },

    { tipo: 'grupo', nombre: 'Maceta', capa: 'cultivo', material: 'plastico-negro',
      en: MACETAS.map(([x, z]) => [x, MESA.alto, z]),
      hijos: [
        { tipo: 'cilindro', diam: 200, diamSup: 250, alto: 220 },
        { tipo: 'cilindro', material: 'sustrato', diam: 240, alto: 12, pos: [0, 200, 0] },
        { tipo: 'planta', nombre: 'Planta', pos: [0, 212, 0] },
      ] },

    { tipo: 'caja-abierta', id: 'gabinete', nombre: 'Gabinete', capa: 'control', material: 'plastico-gris',
      dims: GAB.dims, pared: GAB.pared, pos: [GAB.x, MESA.alto, GAB.z] },
    { tipo: 'caja', nombre: 'Tapa gabinete', capa: 'control', material: 'plastico-blanco',
      dims: [GAB.dims[0], 6, GAB.dims[2]], pos: [GAB.x, MESA.alto + GAB.dims[1], GAB.z], explota: [0, 90, 0] },
    { tipo: 'caja', nombre: 'Placa controladora', capa: 'control', material: 'pcb-verde',
      dims: [70, 1.6, 28], pos: [GAB.x, MESA.alto + GAB.pared + 8, GAB.z], dentroDe: 'gabinete' },
    { tipo: 'panel', nombre: 'Malla sombra trasera', capa: 'estructura', material: 'malla-sombra',
      dims: [MESA.ancho, 600], pos: [0, MESA.alto, -MESA.fondo / 2 - 20] },
  ],
  cotas: [
    { de: [EST.x - EST.diam / 2, 5, 0], a: [EST.x - EST.diam / 2, 5 + EST.agua, 0], desplazar: [-80, 0, 0],
      texto: `agua ${fmtLen(EST.agua)}` },
  ],
  avisos: [
    { nivel: 'info', titulo: 'Plantilla', texto: 'Este SPEC es un ejemplo: se reemplaza completo entre SPEC:INICIO y SPEC:FIN.' },
    { nivel: 'ok', titulo: 'Capacidad', texto: `Estanque Ø${EST.diam} mm con agua a ${fmtLen(EST.agua)} ≈ ${fmtNum(litros(EST.diam - 10, EST.agua))} L.` },
  ],
  constructores: {
    planta(THREE, p, ctx) {
      const g = new THREE.Group();
      g.add(ctx.mesh(new THREE.CylinderGeometry(4, 6, 180, 8).translate(0, 90, 0), 'tallo'));
      g.add(ctx.mesh(new THREE.IcosahedronGeometry(90, 1).translate(0, 240, 0), 'follaje'));
      return g;
    },
  },
};

/* =============================== SPEC:FIN =============================== */

/* ============================ MOTOR — no editar ============================
   Módulo profundo: recibe SPEC, entrega el visor. Expone window.__viewer
   (ready, fallo, errores, selfTest) para scripts/verify.mjs.                 */

// Ayudas disponibles dentro del SPEC (declaraciones de función: se elevan).
function fmtNum(n) { const r = Math.round(n * 10) / 10; return Number.isInteger(r) ? String(r) : r.toFixed(1); }
function fmtLen(mm) { return Math.abs(mm) < 1000 ? `${fmtNum(mm)} mm` : `${(mm / 1000).toFixed(2)} m`; }
function litros(diam, alto, diamSup = diam) {
  const r1 = diam / 2, r2 = diamSup / 2;
  return Math.round((Math.PI * alto / 3) * (r1 * r1 + r1 * r2 + r2 * r2) / 1e5) / 10;
}

const viewer = (window.__viewer = { ready: false, fallo: null, errores: [], selfTest: null });
const $ = (s) => document.querySelector(s);
const DEG = Math.PI / 180;
const UP = new THREE.Vector3(0, 1, 0);
const V = (a) => new THREE.Vector3(a?.[0] ?? 0, a?.[1] ?? 0, a?.[2] ?? 0);
const REDUCED = matchMedia('(prefers-reduced-motion: reduce)').matches;
const COARSE = matchMedia('(pointer: coarse)').matches;
const MOBILE = () => innerWidth <= 720;
const tok = (name) => getComputedStyle(document.documentElement).getPropertyValue(name).trim();
const esc = (s) => String(s ?? '').replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

function specError(msg) { viewer.errores.push(msg); console.error('[SPEC] ' + msg); }
function fail(tipo, html) {
  viewer.fallo = tipo;
  const el = $('#fallo'); el.dataset.tipo = tipo; el.hidden = false;
  el.querySelector('.msg').innerHTML = html;
}

/* ---------- Materiales ---------- */
const PRESETS = {
  'madera':           { nombre: 'Madera tratada', color: '#b98a57', rugosidad: 0.78, bordes: true },
  'madera-oscura':    { nombre: 'Madera oscura', color: '#7c5a3a', rugosidad: 0.8, bordes: true },
  'metal':            { nombre: 'Acero galvanizado', color: '#b8c0c8', metal: 0.85, rugosidad: 0.3 },
  'aluminio':         { nombre: 'Aluminio', color: '#d4d8dd', metal: 0.8, rugosidad: 0.35 },
  'laton':            { nombre: 'Latón / dorado', color: '#c9a646', metal: 0.9, rugosidad: 0.3 },
  'plastico-gris':    { nombre: 'Plástico gris', color: '#8b929c', rugosidad: 0.6 },
  'plastico-negro':   { nombre: 'Plástico negro', color: '#262b33', rugosidad: 0.55 },
  'plastico-blanco':  { nombre: 'Plástico blanco', color: '#e5e7eb', rugosidad: 0.55 },
  'petg-verde':       { nombre: 'PETG verde', color: '#10b981', rugosidad: 0.45 },
  'petg-azul':        { nombre: 'PETG azul', color: '#2563eb', rugosidad: 0.45 },
  'tpu-blanco':       { nombre: 'TPU blanco', color: '#f1f5f9', rugosidad: 0.85 },
  'pcb-verde':        { nombre: 'PCB verde', color: '#166534', rugosidad: 0.6 },
  'pcb-azul':         { nombre: 'PCB azul', color: '#1e3a8a', rugosidad: 0.6 },

function expand(list) {

    if (!p || typeof p !== 'object') { specError(`pieza inválida: ${JSON.stringify(p)}`); continue; }

      if (!Number.isInteger(n) || n < 1) { specError(`«${label(p)}»: repetir.n debe ser entero ≥ 1`); continue; }
      at = Array.from({ length: n }, (_, i) => [b[0] + paso[0] * i, b[1] + paso[1] * i, b[2] + paso[2] * i]);
    }
    if (!at) { out.push(p); continue; }
    at.forEach((pos, i) => {

    const cv = document.createElement('canvas'); cv.width = src.width; cv.height = src.height;
    const g = cv.getContext('2d'); g.drawImage(src, 0, 0);
    g.font = `700 ${11 * dpr}px system-ui, sans-serif`; g.textAlign = 'center'; g.textBaseline = 'middle';
    const p = new THREE.Vector3();
    for (const o of LBL) {
      if (!visibleDeep(o)) continue;
      o.getWorldPosition(p).project(camera); if (p.z < -1 || p.z > 1) continue;
      const x = ((p.x + 1) / 2) * cv.width, y = ((1 - p.y) / 2) * cv.height, t = o.element.textContent;
      const w = g.measureText(t).width + 12 * dpr, h = 18 * dpr, isCota = o.element.className === 'cota-lbl';
      g.fillStyle = tok('--cota-bg'); g.strokeStyle = isCota ? tok('--cota') : tok('--border');
      g.beginPath(); g.roundRect ? g.roundRect(x - w / 2, y - h / 2, w, h, 5 * dpr) : g.rect(x - w / 2, y - h / 2, w, h); g.fill(); g.stroke();
      g.fillStyle = isCota ? tok('--cota') : tok('--tag'); g.fillText(t, x, y + dpr);
    }
    g.textAlign = 'left'; g.font = `600 ${13 * dpr}px system-ui, sans-serif`; g.fillStyle = tok('--muted');
    g.fillText(`${SPEC.titulo ?? ''} · ${new Date().toISOString().slice(0, 10)}`, 14 * dpr, cv.height - 16 * dpr);
    return cv.toDataURL('image/png');
  }
  const slug = (SPEC.titulo ?? 'gemelo-3d').normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '');
  $('#b-png').addEventListener('click', () => {
    try { const a = document.createElement('a'); a.href = snapshot(); a.download = `${slug}.png`; document.body.appendChild(a); a.click(); a.remove(); }
    catch (e) { console.warn('No se pudo generar el PNG:', e); }
  });
  let themeBeforePrint = null;
  addEventListener('beforeprint', () => {
    themeBeforePrint = document.documentElement.dataset.theme;
    if (themeBeforePrint !== 'light') applyTheme('light', false);
    const rows = TOP.map((i) => `<tr><td>${esc(i.nombre)}</td><td>${esc(capaNombre(i.capa))}</td><td>${esc(i.dims)}</td><td>${esc(i.nota)}</td></tr>`).join('');
    $('#print-sheet').innerHTML = `<h1>${esc(SPEC.titulo ?? '')}</h1><p>${esc(SPEC.subtitulo ?? '')}</p><img alt="" src="${snapshot()}">`
      + (SPEC.avisos ?? []).map((a) => `<p><strong>${esc(a.titulo ?? '')}:</strong> ${esc(a.texto ?? '')}</p>`).join('')
      + `<table><thead><tr><th>Pieza</th><th>Capa</th><th>Medidas</th><th>Nota</th></tr></thead><tbody>${rows}</tbody></table>`;
  });
  addEventListener('afterprint', () => { if (themeBeforePrint && themeBeforePrint !== 'light') applyTheme(themeBeforePrint, false); });

  // Errores del SPEC visibles para quien abra el archivo
  if (viewer.errores.length) {
    const el = $('#errores'); el.hidden = false;
    el.innerHTML = `<strong>⚠ ${viewer.errores.length} error(es) en el SPEC</strong><ul>${viewer.errores.map((m) => `<li>${esc(m)}</li>`).join('')}</ul>`;
  }

  // Autoprueba para scripts/verify.mjs
  viewer.snapshot = snapshot;
  viewer.selfTest = () => {
    const W = 160, H = 120, rt = new THREE.WebGLRenderTarget(W, H);
    const cam = new THREE.PerspectiveCamera(40, W / H, R / 200, R * 60);
    const dist = R / Math.sin(Math.min(40 * DEG, 2 * Math.atan(Math.tan(20 * DEG) * W / H)) / 2);
    cam.position.copy(center).add(VIEWS.iso.v.clone().normalize().multiplyScalar(dist)); cam.lookAt(center);
    const bg = scene.background, vis = Object.values(builtin).map((g) => g.visible);
    scene.background = null; Object.values(builtin).forEach((g) => (g.visible = false));
    const prevClear = renderer.getClearAlpha();
    renderer.setRenderTarget(rt); renderer.setClearAlpha(0); renderer.clear(); renderer.render(scene, cam);
    const px = new Uint8Array(W * H * 4); renderer.readRenderTargetPixels(rt, 0, 0, W, H, px);
    renderer.setRenderTarget(null); renderer.setClearAlpha(prevClear);
    scene.background = bg; Object.values(builtin).forEach((g, i) => (g.visible = vis[i])); rt.dispose(); dirty();
    let n = 0; for (let i = 3; i < px.length; i += 4) if (px[i] > 0) n++;
    const cobertura = n / (W * H);
    return {
      ok: viewer.errores.length === 0 && TOP.length === specParts.length && cobertura >= 0.02,
      three: THREE.REVISION, webgl2: renderer.capabilities.isWebGL2,
      piezas: TOP.length, esperadas: specParts.length, errores: [...viewer.errores],
      cobertura: Math.round(cobertura * 1000) / 1000, triangulos: renderer.info.render.triangles,
      medidas: `${fmtNum(size.x)} × ${fmtNum(size.y)} × ${fmtNum(size.z)} mm`,
    };
  };

  // Bucle: solo redibuja cuando algo cambió
  new ResizeObserver(frame).observe(stage);
  addEventListener('resize', frame);
  frame();
  view(SPEC.vistaInicial ?? 'iso', true);
  let hintHidden = false;
  controls.addEventListener('start', () => { if (!hintHidden) { hintHidden = true; $('#hint').style.opacity = '0.6'; } });
  function loop(now) {
    requestAnimationFrame(loop);
    if (tween) {
      const k = Math.min(1, (now - tween.t0) / 500), e = k < 0.5 ? 2 * k * k : 1 - (-2 * k + 2) ** 2 / 2;
      camera.position.lerpVectors(tween.p0, tween.p1, e); controls.target.lerpVectors(tween.q0, tween.q1, e);
      if (k === 1) tween = null; dirty();
    }
    if (hoverQ) { const h = pick(...hoverQ); hoverQ = null; if (h !== hovered) { hovered = h; refresh(); } }
    controls.update();
    if (!needs) return;
    needs = false; render();
  }
  render();
  viewer.ready = true;
  const f = $('#fallo'); if (f.dataset.tipo === 'carga') f.hidden = true;
  requestAnimationFrame(loop);
}

try { main(); } catch (e) {
  console.error(e);
  fail('motor', `<h2>El visor falló al iniciar</h2><p>${esc(e.message)}</p>`);
}
</script>
</body>
</html>
